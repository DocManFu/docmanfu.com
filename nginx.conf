server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok
"; }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
