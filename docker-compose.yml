services:
  web:
    build: .
    image: docmanfu-marketing:latest
    container_name: docmanfu-marketing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8530:80"
    networks:
      - caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  caddy:
    external: true
    name: caddy_default
